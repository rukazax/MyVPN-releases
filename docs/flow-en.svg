<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-label="Diagram: phone — own entry — foreign exit — internet">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b28"/>
      <stop offset="1" stop-color="#0c2420"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cf7b4"/>
      <stop offset="1" stop-color="#17a866"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#48c98d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="300" rx="18" fill="url(#card)"/>

  <!-- nodes -->
  <g font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <rect x="36" y="74" width="206" height="92" rx="14" fill="#10222f" stroke="#2b4a5c" stroke-width="1.5"/>
    <text x="139" y="115" text-anchor="middle" font-size="17" fill="#eaf6ff">Phone</text>
    <text x="139" y="142" text-anchor="middle" font-size="13" fill="#7e9ab0">MyVPN, Android</text>

    <rect x="292" y="74" width="206" height="92" rx="14" fill="#0f2b22" stroke="#2b6350" stroke-width="1.5"/>
    <text x="395" y="115" text-anchor="middle" font-size="17" fill="#eaf6ff">Own entry</text>
    <text x="395" y="142" text-anchor="middle" font-size="13" fill="#7fc7a3">Reality · TLS</text>

    <rect x="548" y="74" width="206" height="92" rx="14" fill="#0f2b22" stroke="#2b6350" stroke-width="1.5"/>
    <text x="651" y="115" text-anchor="middle" font-size="17" fill="#eaf6ff">Foreign exit</text>
    <text x="651" y="142" text-anchor="middle" font-size="13" fill="#7fc7a3">ordinary traffic</text>

    <rect x="804" y="74" width="200" height="92" rx="14" fill="#10222f" stroke="#2b4a5c" stroke-width="1.5"/>
    <text x="904" y="115" text-anchor="middle" font-size="17" fill="#eaf6ff">Internet</text>
    <text x="904" y="142" text-anchor="middle" font-size="13" fill="#7e9ab0">websites and services</text>
  </g>

  <!-- arrows -->
  <path d="M244 120 H286" stroke="#48c98d" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M500 120 H542" stroke="#48c98d" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M756 120 H798" stroke="#48c98d" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- isolates -->
  <path d="M268 100 v-22 q0 -10 10 -10 H758 q10 0 10 10 v22" fill="none" stroke="#48c98d" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="518" y="58" text-anchor="middle" font-size="12" letter-spacing="1.6" fill="#5fb994">ISOLATED CASCADE</text>

  <!-- fallback row -->
  <line x1="36" y1="204" x2="1004" y2="204" stroke="#1c3a33" stroke-width="1"/>
  <text x="36" y="236" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6d8aa0">If the primary entry does not answer, the client falls back through:</text>
  <g font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#9fe6c4">
    <text x="36" y="266">Reality · primary</text>
    <text x="196" y="266" fill="#3d7a63">→</text>
    <text x="222" y="266">Reality · backup</text>
    <text x="364" y="266" fill="#3d7a63">→</text>
    <text x="390" y="266">SSH</text>
    <text x="436" y="266" fill="#3d7a63">→</text>
    <text x="462" y="266">AmneziaWG</text>
    <text x="570" y="266" fill="#3d7a63">→</text>
    <text x="596" y="266">RIVET</text>
  </g>
</svg>
